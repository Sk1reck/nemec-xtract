<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEMEC™ XTRACT — Universal Media Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Outfit:wght@200;300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#080808;--bg2:#111111;--fg:#f2f2f2;--muted:#555;--border:#222;
  --card:#121212;--glow:rgba(242,242,242,.06);--accent:#f2f2f2;
  --err:#ff4545;--ok:#a0ff90;--t-speed:.35s;
}
[data-theme="light"] {
  --bg:#f0ede8;--bg2:#e8e5e0;--fg:#0e0e0e;--muted:#999;--border:#d4d0ca;
  --card:#faf8f5;--glow:rgba(0,0,0,.04);--accent:#0e0e0e;
  --err:#cc2222;--ok:#1a7a10;--t-speed:.35s;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;transition:background var(--t-speed),color var(--t-speed);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.03;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 24px 80px;}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:36px 0 0;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,10vw,90px);letter-spacing:-.01em;line-height:.9;color:var(--fg);transition:color var(--t-speed);}
.logo span{font-size:.5em;vertical-align:super;letter-spacing:.05em;opacity:.7;}
.tagline{font-size:11px;font-family:'Space Mono',monospace;letter-spacing:.18em;color:var(--muted);margin-top:8px;text-transform:uppercase;}
.theme-btn{background:none;border:1px solid var(--border);color:var(--fg);cursor:pointer;border-radius:50px;padding:8px 16px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;display:flex;align-items:center;gap:8px;margin-top:10px;transition:all .2s;white-space:nowrap;}
.theme-btn:hover{background:var(--fg);color:var(--bg);}
.theme-icon{font-size:14px;transition:transform .4s}
.theme-btn:hover .theme-icon{transform:rotate(20deg)}
.divider{height:1px;background:var(--border);margin:32px 0;position:relative;transition:background var(--t-speed);}
.divider::after{content:'◆';position:absolute;left:50%;transform:translateX(-50%);top:-8px;font-size:10px;color:var(--muted);background:var(--bg);padding:0 10px;transition:background var(--t-speed),color var(--t-speed);}
.platforms{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;}
.platform-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;padding:5px 12px;border:1px solid var(--border);border-radius:3px;color:var(--muted);transition:all .2s;}
.platform-tag:hover{border-color:var(--fg);color:var(--fg);}
.card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:32px;transition:background var(--t-speed),border-color var(--t-speed);}
.card-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
.url-row{display:flex;gap:10px;}
.url-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--fg);font-family:'Space Mono',monospace;font-size:13px;padding:14px 18px;border-radius:3px;outline:none;transition:all .2s;}
.url-input::placeholder{color:var(--muted)}
.url-input:focus{border-color:var(--fg);box-shadow:0 0 0 3px var(--glow);}
.format-row{display:flex;gap:0;margin-top:20px;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
.fmt-btn{flex:1;padding:12px;background:none;border:none;color:var(--muted);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;transition:all .2s;}
.fmt-btn+.fmt-btn{border-left:1px solid var(--border)}
.fmt-btn.active{background:var(--fg);color:var(--bg);}
.fmt-btn:not(.active):hover{background:var(--glow);color:var(--fg);}
.quality-section{margin-top:20px;display:none;}
.quality-section.visible{display:block}
.quality-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.qual-btn{padding:7px 16px;background:none;border:1px solid var(--border);border-radius:3px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;transition:all .2s;}
.qual-btn.active{border-color:var(--fg);color:var(--fg);background:var(--glow);}
.qual-btn:hover{color:var(--fg)}
.dl-btn{width:100%;margin-top:24px;padding:18px;background:var(--fg);color:var(--bg);border:none;border-radius:3px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.15em;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.dl-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.12) 50%,transparent 100%);transform:translateX(-100%);transition:transform .5s ease;}
.dl-btn:hover::after{transform:translateX(100%)}
.dl-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dl-btn:active{transform:translateY(0)}
.dl-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.status{margin-top:20px;padding:14px 18px;border-radius:3px;font-family:'Space Mono',monospace;font-size:12px;line-height:1.6;display:none;animation:fadeIn .3s ease;}
.status.show{display:block}
.status.loading{border:1px solid var(--border);color:var(--muted);}
.status.success{border:1px solid var(--ok);color:var(--ok);background:rgba(160,255,144,.05);}
.status.error{border:1px solid var(--err);color:var(--err);background:rgba(255,69,69,.05);}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--muted);border-top-color:var(--fg);border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px;}
.picker-item{aspect-ratio:1;background:var(--bg);border:1px solid var(--border);border-radius:3px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative;display:flex;align-items:center;justify-content:center;}
.picker-item img{width:100%;height:100%;object-fit:cover}
.picker-item:hover{border-color:var(--fg)}
.picker-item .pick-label{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.7);color:#fff;font-size:9px;font-family:'Space Mono',monospace;padding:4px 6px;text-align:center;}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:20px 18px;transition:all .2s,background var(--t-speed);}
.info-card:hover{border-color:var(--fg)}
.info-num{font-family:'Bebas Neue',sans-serif;font-size:36px;line-height:1;color:var(--fg);}
.info-label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--muted);margin-top:4px;text-transform:uppercase;}
footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.footer-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.05em;color:var(--muted);}
.footer-note{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);}
.live-dot{display:inline-block;width:6px;height:6px;background:var(--ok);border-radius:50%;animation:pulse 1.5s infinite;margin-right:6px;vertical-align:middle;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@media(max-width:560px){
  .info-grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .info-num{font-size:26px}
  .card{padding:20px}
  header{flex-direction:column;gap:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-block">
      <div class="logo">NEMEC<span>™</span> XTRACT</div>
      <div class="tagline"><span class="live-dot"></span>Universal Media Extractor · Powered by Cobalt</div>
    </div>
    <button class="theme-btn" onclick="toggleTheme()">
      <span class="theme-icon" id="themeIcon">◑</span>
      <span id="themeLabel">LIGHT MODE</span>
    </button>
  </header>
  <div class="divider"></div>
  <div class="platforms">
    <div class="platform-tag">▶ YOUTUBE</div>
    <div class="platform-tag">♪ TIKTOK</div>
    <div class="platform-tag">◈ INSTAGRAM</div>
    <div class="platform-tag">✦ TWITTER / X</div>
    <div class="platform-tag">◉ REDDIT</div>
    <div class="platform-tag">○ VIMEO</div>
    <div class="platform-tag">◇ SOUNDCLOUD</div>
    <div class="platform-tag">+ DALŠÍ</div>
  </div>
  <div class="card">
    <div class="card-label">// VLOŽTE URL</div>
    <div class="url-row">
      <input class="url-input" id="urlInput" type="url"
        placeholder="https://youtube.com/watch?v=  nebo  tiktok.com/..."
        autocomplete="off" spellcheck="false">
    </div>
    <div class="format-row">
      <button class="fmt-btn active" id="fmtMP4" onclick="setFormat('mp4')">▶ MP4 &nbsp;VIDEO</button>
      <button class="fmt-btn" id="fmtMP3" onclick="setFormat('mp3')">♪ MP3 &nbsp;AUDIO</button>
    </div>
    <div class="quality-section visible" id="qualSection">
      <div class="card-label" style="margin-top:20px">// KVALITA VIDEA</div>
      <div class="quality-grid">
        <button class="qual-btn" id="q144" onclick="setQuality('144')">144p</button>
        <button class="qual-btn" id="q360" onclick="setQuality('360')">360p</button>
        <button class="qual-btn" id="q480" onclick="setQuality('480')">480p</button>
        <button class="qual-btn active" id="q720" onclick="setQuality('720')">720p HD</button>
        <button class="qual-btn" id="q1080" onclick="setQuality('1080')">1080p FHD</button>
        <button class="qual-btn" id="q2160" onclick="setQuality('2160')">4K UHD</button>
      </div>
    </div>
    <button class="dl-btn" id="dlBtn" onclick="startDownload()">⬇ &nbsp; STÁHNOUT</button>
    <div class="status" id="statusBox"></div>
    <div id="pickerArea"></div>
  </div>
  <div class="info-grid">
    <div class="info-card"><div class="info-num">20+</div><div class="info-label">Platforem</div></div>
    <div class="info-card"><div class="info-num">4K</div><div class="info-label">Max kvalita</div></div>
    <div class="info-card"><div class="info-num">∞</div><div class="info-label">Bez limitu</div></div>
  </div>
  <footer>
    <div class="footer-logo">NEMEC™ XTRACT</div>
    <div class="footer-note">ONLY FOR PERSONAL USE · © 2025 NEMEC™</div>
  </footer>
</div>
<script>
let currentFormat = 'mp4';
let currentQuality = '720';
const API   = 'https://cobalt-api-production-de39.up.railway.app';
const PROXY = 'https://corsproxy.io/?url=' + encodeURIComponent(API);

(function(){
  const saved = localStorage.getItem('nemec-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeBtn(saved);
})();

function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nemec-theme', next);
  updateThemeBtn(next);
}
function updateThemeBtn(t){
  document.getElementById('themeIcon').textContent = t==='dark' ? '◑' : '◐';
  document.getElementById('themeLabel').textContent = t==='dark' ? 'LIGHT MODE' : 'DARK MODE';
}
function setFormat(fmt){
  currentFormat = fmt;
  document.getElementById('fmtMP4').classList.toggle('active', fmt==='mp4');
  document.getElementById('fmtMP3').classList.toggle('active', fmt==='mp3');
  document.getElementById('qualSection').classList.toggle('visible', fmt==='mp4');
  clearStatus();
}
function setQuality(q){
  currentQuality = q;
  ['144','360','480','720','1080','2160'].forEach(v=>
    document.getElementById('q'+v).classList.toggle('active', v===q));
}
function showStatus(type, html){
  const b = document.getElementById('statusBox');
  b.className = 'status show ' + type;
  b.innerHTML = html;
}
function clearStatus(){
  document.getElementById('statusBox').className = 'status';
  document.getElementById('statusBox').innerHTML = '';
  document.getElementById('pickerArea').innerHTML = '';
}

async function startDownload(){
  const url = document.getElementById('urlInput').value.trim();
  if(!url){ showStatus('error','⚠ Vložte URL adresu.'); return; }
  try { new URL(url); } catch(e){ showStatus('error','⚠ Neplatná URL adresa.'); return; }

  document.getElementById('pickerArea').innerHTML = '';
  document.getElementById('dlBtn').disabled = true;
  showStatus('loading','<span class="spinner"></span> Zpracovávám požadavek…');

  const body = { url };
  if(currentFormat === 'mp3'){
    body.downloadMode = 'audio';
    body.audioFormat  = 'mp3';
  } else {
    body.downloadMode = 'auto';
    body.videoQuality = currentQuality;
  }

  const opts = {
    method: 'POST',
    headers: { 'Accept':'application/json','Content-Type':'application/json' },
    body: JSON.stringify(body)
  };

  let data;
  try {
    let res;
    try { res = await fetch(API, opts); }
    catch(_){ res = await fetch(PROXY, opts); }
    data = await res.json();
  } catch(err){
    showStatus('error', '⚠ Chyba: ' + err.message);
    document.getElementById('dlBtn').disabled = false;
    return;
  }

  document.getElementById('dlBtn').disabled = false;
  handleResponse(data);
}

function handleResponse(data){
  const s = data.status;
  if(s === 'error'){
    showStatus('error','⚠ ' + (data?.error?.code || data?.text || 'Neznámá chyba'));
    return;
  }
  if(s === 'redirect' || s === 'tunnel'){
    triggerDownload(data.url, data.filename || 'download');
    showStatus('success','✓ Stahování zahájeno!<br><small style="opacity:.6">'+
      (data.filename||'download')+'</small>');
    return;
  }
  if(s === 'picker'){
    showStatus('success','✓ Nalezeno '+data.picker.length+' souborů — klikni pro stažení:');
    renderPicker(data.picker);
    return;
  }
  showStatus('error','⚠ Neočekávaná odpověď: '+JSON.stringify(data).slice(0,120));
}
function triggerDownload(url, filename){
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function renderPicker(items){
  const area = document.getElementById('pickerArea');
  const grid = document.createElement('div');
  grid.className = 'picker-grid';
  items.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className = 'picker-item';
    div.onclick = ()=> triggerDownload(item.url, item.filename||('item_'+(i+1)));
    if(item.thumb){
      const img = document.createElement('img');
      img.src=item.thumb; img.alt='thumb'; div.appendChild(img);
    } else {
      div.innerHTML='<span style="font-family:\'Space Mono\',monospace;font-size:10px;color:var(--muted)">FILE '+(i+1)+'</span>';
    }
    const lbl = document.createElement('div');
    lbl.className='pick-label'; lbl.textContent='⬇ #'+(i+1);
    div.appendChild(lbl); grid.appendChild(div);
  });
  area.appendChild(grid);
}
document.getElementById('urlInput').addEventListener('keydown', e=>{
  if(e.key==='Enter') startDownload();
  if(e.key==='Escape') clearStatus();
});
document.getElementById('urlInput').addEventListener('paste', ()=>{
  setTimeout(()=>{
    const v = document.getElementById('urlInput').value.trim();
    if(v.startsWith('http')) startDownload();
  }, 80);
});
</script>
</body>
</html>
